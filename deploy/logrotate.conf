# /etc/logrotate.d/eatalay: nginx erişim kayıtları 14 gün tutulur, sonra silinir.
/var/log/nginx/eatalay.*.log {
    daily
    rotate 14
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        [ -s /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)"
    endscript
}
