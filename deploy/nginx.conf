# eatalay.dev: nginx yapılandırması. kurulum.sh bunu /etc/nginx/sites-available/eatalay.dev olarak kurar.
# eatalay-kurulum: kurulum.sh bu satırı taşıyan dosyayı kendisinin sayar ve güncelleyebilir.
#
# Güvenlik başlıkları (HSTS, nosniff, Referrer-Policy, X-Frame-Options, Permissions-Policy) Next.js gönderir
# (next.config.ts) ve buradan olduğu gibi iletilir. nginx'in kendi ürettiği yönlendirmelere yalnız HSTS eklenir.
# .dev alan adları tarayıcılarda zorunlu HTTPS'tir (HSTS ön yükleme listesi); düz HTTP yalnız yönlendirme içindir.
#
# Sunucudaki nginx 1.26: `http2 on;` kullanılır (`listen ... http2` eskidi). Brotli modülü Huzuru İslam kurulumuyla gelmiştir.

# Next.js görsel iyileştiricisinin çıktısı (AVIF/WebP) nginx önbelleğinde tutulur: aynı görsel
# her istekte Node'a gitmez. Anahtar URL (src+w+q) ve tarayıcının kabul ettiği biçimdir (AVIF/WebP ayrı tutulur).
map $http_accept $eatalay_img_format {
    ~image/avif avif;
    ~image/webp webp;
    default     orig;
}
proxy_cache_path /var/cache/nginx/eatalay_img levels=1:2 keys_zone=eatalay_img:10m max_size=512m inactive=30d use_temp_path=off;

upstream eatalay {
    server 127.0.0.1:3030;
    keepalive 8;
}

# Erişim kaydı: IP, tarih, istek, durum, tarayıcı. 14 gün sonra silinir (deploy/logrotate.conf).
log_format eatalay '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

# 80: Let's Encrypt doğrulaması dışında her şey HTTPS'e gider.
server {
    listen 80;
    listen [::]:80;
    server_name eatalay.dev www.eatalay.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://eatalay.dev$request_uri;
    }
}

# www → çıplak alan adı
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eatalay.dev;

    ssl_certificate     /etc/letsencrypt/live/eatalay.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eatalay.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://eatalay.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eatalay.dev;

    ssl_certificate     /etc/letsencrypt/live/eatalay.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eatalay.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/eatalay.access.log eatalay;
    error_log  /var/log/nginx/eatalay.error.log warn;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml font/ttf font/otf;

    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css text/xml application/javascript application/json application/xml
                 application/manifest+json image/svg+xml font/ttf font/otf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Adları içerik özetiyle değişen dosyalar: bir yıl, değişmez.
    location /_next/static/ {
        proxy_pass http://eatalay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Optimize edilmiş görseller: kaynak dosya adları içerik özetli olduğundan bir yıl tutulabilir.
    location /_next/image {
        proxy_pass http://eatalay;
        proxy_cache eatalay_img;
        proxy_cache_key "$scheme$host$request_uri$eatalay_img_format";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Vary;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://eatalay;
    }
}
